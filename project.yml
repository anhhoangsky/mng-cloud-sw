name: MNGCloud

options:
  bundleIdPrefix: com.mngcloud
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  MNGCore:
    path: Packages/MNGCore
  MNGKit:
    path: Packages/MNGKit
  MNGEdit:
    path: Packages/MNGEdit

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MNGCloud:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Resources/Info.plist"
          # The Aurum bundle is a plain script, so it has to be copied into the
          # app bundle instead of being compiled.
          - "Resources/aurum.min.js"
      - path: App/Resources/aurum.min.js
        buildPhase: resources
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: MNG Cloud
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: "Ảnh và video được chọn hoặc sao lưu tự động lên thư viện của bạn."
        NSPhotoLibraryAddUsageDescription: "Lưu ảnh và video về thư viện ảnh."
        UIBackgroundModes:
          - processing
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.mngcloud.app.backup.process
          - com.mngcloud.app.backup.refresh
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mngcloud.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - package: MNGCore
      - package: MNGKit
      - package: MNGEdit
    scheme:
      testTargets:
        - MNGCloudTests
      gatherCoverageData: true

  MNGCloudTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MNGCloudTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mngcloud.app.tests
    dependencies:
      - package: MNGCore
      - package: MNGKit
