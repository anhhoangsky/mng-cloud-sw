name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # The Liquid Glass APIs (`glassEffect`) need the iOS 26 SDK, so the
          # runner must use Xcode 26 even though the app still deploys to
          # iOS 17.
          xcode-version: "26.3"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache SwiftPM and DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            Packages/MNGCore/.build
            Packages/MNGKit/.build
            Packages/MNGEdit/.build
            build
          key: ios-${{ runner.os }}-${{ hashFiles('Packages/**/Package.swift', 'project.yml') }}

      - name: Generate project
        run: xcodegen generate

      - name: MNGCore tests (macOS)
        run: swift test --package-path Packages/MNGCore

      - name: MNGKit tests (macOS)
        run: swift test --package-path Packages/MNGKit

      - name: MNGEdit tests (macOS)
        run: swift test --package-path Packages/MNGEdit

      - name: Build simulator (unsigned)
        run: |
          xcodebuild -project MNGCloud.xcodeproj -scheme MNGCloud \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      # Keeps the AltStore path honest: the runner builds the same unsigned
      # device archive and packs the very same .ipa the build-ios workflow
      # publishes.
      - name: Build unsigned device app (AltStore path)
        run: |
          set -euo pipefail
          bash ./scripts/check-personal-team-entitlements.sh App
          xcodebuild -project MNGCloud.xcodeproj -scheme MNGCloud \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          bash ./scripts/make-unsigned-ipa.sh \
            "build/device/Build/Products/Release-iphoneos/MNGCloud.app" \
            "build/device/MNGCloud.ipa"

      - name: Upload the unsigned AltStore IPA
        uses: actions/upload-artifact@v4
        with:
          name: MNGCloud-AltStore-IPA
          path: build/device/MNGCloud.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Test simulator
        run: |
          # The runner image does not always ship a booted iOS simulator, so
          # pick any available device and fall back to compiling the test
          # bundle when the runtime is missing.
          UDID="$(xcrun simctl list devices available \
            | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' \
            | head -1)"
          if [ -n "$UDID" ]; then
            xcodebuild -project MNGCloud.xcodeproj -scheme MNGCloud \
              -destination "platform=iOS Simulator,id=$UDID" \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO test
          else
            echo "No iOS simulator device is available on this runner; compiling the test target instead."
            xcodebuild -project MNGCloud.xcodeproj -scheme MNGCloud \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO build-for-testing
          fi

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: MNGCloud-simulator
          path: build/Build/Products/Debug-iphonesimulator/MNGCloud.app
          if-no-files-found: error
