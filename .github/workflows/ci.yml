name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Pin once the runner image rotates; 16.4 ships the iPhone 16
          # simulator used below.
          xcode-version: "16.4"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache SwiftPM and DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            Packages/MNGCore/.build
            Packages/MNGKit/.build
            Packages/MNGEdit/.build
            build
          key: ios-${{ runner.os }}-${{ hashFiles('Packages/**/Package.swift', 'project.yml') }}

      - name: Generate project
        run: xcodegen generate

      - name: MNGCore tests (macOS)
        run: swift test --package-path Packages/MNGCore

      - name: MNGKit tests (macOS)
        run: swift test --package-path Packages/MNGKit

      - name: MNGEdit tests (macOS)
        run: swift test --package-path Packages/MNGEdit

      - name: Build simulator (unsigned)
        run: |
          xcodebuild -project MNGCloud.xcodeproj -scheme MNGCloud \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Test simulator
        run: |
          xcodebuild -project MNGCloud.xcodeproj -scheme MNGCloud \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO test

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: MNGCloud-simulator
          path: build/Build/Products/Debug-iphonesimulator/MNGCloud.app
          if-no-files-found: error
