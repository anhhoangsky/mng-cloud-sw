name: build-ios

# Builds an **unsigned** iOS device build and packs it as an .ipa that
# AltStore / AltServer can re-sign with the user's own (free) Apple ID.
#
# The runner never sees an Apple credential: it only compiles the app and
# packs `Payload/MNGCloud.app`. Signing happens on the user's machine, which
# keeps the free Personal Team limits (7 day profiles, no push/iCloud/App
# Groups) visible in the check below.
#
# The paid signing paths live in `build-ios-signed.yml`.

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: false
        default: Release
        type: choice
        options:
          - Release
          - Debug
      artifact_name:
        description: Artifact name
        required: false
        default: MNGCloud-AltStore-IPA
        type: string

permissions:
  contents: read

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  altstore:
    name: Unsigned IPA for AltStore
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Check the Personal Team capabilities
        run: bash ./scripts/check-personal-team-entitlements.sh App

      - name: Build the unsigned device app
        run: |
          set -euo pipefail
          xcodebuild -project MNGCloud.xcodeproj -scheme MNGCloud \
            -configuration "${{ inputs.configuration }}" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package the unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/dd/Build/Products/${{ inputs.configuration }}-iphoneos/MNGCloud.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "error: $APP_PATH was not produced by the build" >&2
            exit 1
          fi
          mkdir -p build/altstore
          bash ./scripts/make-unsigned-ipa.sh \
            "$APP_PATH" "build/altstore/MNGCloud.ipa"

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: build/altstore/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Summarise the build
        run: |
          set -euo pipefail
          ls -lh build/altstore
          echo
          echo "Bundle id: com.mngcloud.app"
          echo "Install: open the .ipa with AltStore (it re-signs it with your"
          echo "personal Apple ID) or drop it on AltServer."
