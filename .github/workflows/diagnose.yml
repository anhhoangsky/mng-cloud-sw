name: diagnose

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # The build error is reported as a workflow annotation, because the
      # plain log of a public run is only readable when signed in.
      - name: Report the build errors
        run: |
          set -o pipefail
          xcodebuild -project MNGCloud.xcodeproj -scheme MNGCloud \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || true
          grep -E "(error|warning): " build.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::error title=Swift compile::${line}"
          done
          echo "### the raw tail"
          {
            echo '```'
            tail -60 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
