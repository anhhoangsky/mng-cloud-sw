name: diagnose

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # The exact declaration of the Photos API, read out of the SDK that the
      # build uses. The public documentation lists the symbol but not the
      # argument label.
      - name: Report the Photos API
        run: |
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          INTERFACE="$SDK/System/Library/Frameworks/Photos.framework/Modules/Photos.swiftmodule"
          {
            echo '### the Photos interface'
            echo '```'
            grep -rh "registerChangeObserver\|func register(" "$INTERFACE" 2>/dev/null \
              | sort -u | head -30 || echo "(the interface was not found)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -rh "registerChangeObserver" "$INTERFACE" 2>/dev/null \
            | sort -u | head -10 | while IFS= read -r line; do
            echo "::error title=Photos API::${line}"
          done
          exit 0

      # The build error is reported as a workflow annotation, because the
      # plain log of a public run is only readable when signed in.
      - name: Report the build errors
        run: |
          set -o pipefail
          xcodebuild -project MNGCloud.xcodeproj -scheme MNGCloud \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || true
          grep -E "error: " build.log | head -40 | while IFS= read -r line; do
            echo "::error title=Swift compile::${line}"
          done || true
          {
            echo '### the errors'
            echo '```'
            grep -E "error: " build.log | head -40 || echo '(the build has no errors)'
            echo '```'
            echo '### the raw tail'
            echo '```'
            tail -80 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
