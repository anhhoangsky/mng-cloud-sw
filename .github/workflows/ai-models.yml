name: ai-models

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/ai/**"
      - ".github/workflows/ai-models.yml"
    tags:
      # A tag run publishes the archives to an immutable GitHub release, so
      # the app catalog can pin SHA-256 values that never change. Branch runs
      # only validate and upload the 30-day Actions artifact.
      - "ai-models-v*"

permissions:
  # Publishing the tagged archives needs write access; everything else in
  # this workflow only reads the repository.
  contents: write

concurrency:
  group: ai-models-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convert:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pinned model sources
        uses: actions/cache@v4
        with:
          path: tools/ai/.cache
          key: ai-models-${{ hashFiles('tools/ai/models.json') }}

      - name: Install conversion tools
        run: |
          python -m pip install --upgrade pip
          # coremltools 9 supports PyTorch 2.7 and removed the ONNX importer;
          # the pipeline rebuilds each model in PyTorch from its official
          # checkpoint, proves it against the fp32 ONNX reference, then converts.
          python -m pip install \
            "torch==2.7.0" \
            "coremltools==9.0" \
            "onnxruntime" \
            "numpy" \
            "pillow"

      - name: Validate the manifest
        run: python tools/ai/convert_coreml.py --check-manifest

      - name: Prove PyTorch matches the web ONNX models
        run: python tools/ai/convert_coreml.py --validate-only --model all

      - name: Convert and validate
        run: python tools/ai/convert_coreml.py --model all

      - name: Show artifact summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("tools/ai/artifacts/summary.json").read_text())
          for model in summary["models"]:
              coreml = model["validation"]["coremlVsReference"]
              worst = max(coreml.values(), key=lambda m: m["mean_abs_diff"])
              print(
                  f"{model['id']}: {model['archiveBytes']:,} B "
                  f"sha256={model['archiveSha256']} "
                  f"worst_mean_diff={worst['mean_abs_diff']:.5f} "
                  f"worst_p99={worst['p99_abs_diff']:.5f}"
              )
          PY

      - name: Upload Core ML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-coreml-${{ github.run_id }}
          path: tools/ai/artifacts/**
          if-no-files-found: error
          retention-days: 30

      # The app pins `archiveSha256` and `archiveBytes` from this release.
      # Never reuse a tag: zip metadata and Core ML manifests are not
      # byte-reproducible, so a rebuilt archive would invalidate the pins.
      - name: Publish pinned model archives
        if: startsWith(github.ref, 'refs/tags/ai-models-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Native AI models $tag" \
              --notes "Core ML artifacts for the native AI engine. Immutable: the app pins each archive SHA-256 from summary.json. Licenses and attribution are in each archive's LICENSE.txt."
          fi
          gh release upload "$tag" \
            tools/ai/artifacts/*/*.mlpackage.zip \
            tools/ai/artifacts/summary.json
