name: ai-models

# Branch/manual validation. This workflow only uploads the 30-day Actions
# artifact; publishing happens in ai-models-release.yml from an ai-models-v*
# tag. A single push trigger cannot require both a path filter and a tag:
# GitHub treats `paths` and `tags` as an AND, so branch pushes would never
# match.
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/ai/**"
      - ".github/workflows/ai-models*.yml"

permissions:
  contents: read

concurrency:
  group: ai-models-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convert:
    permissions:
      contents: read
    uses: ./.github/workflows/ai-models-convert.yml
    with:
      publish: false
